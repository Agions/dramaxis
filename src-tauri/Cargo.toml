[workspace]
resolver = "2"
members = [
    ".",
    # ── Rust 业务 crates (Multi-Agent 智能体协作体系) ──
    # 多智能体协同引擎
    "crates/agent",     # Director/VisualCritic/Screenwriter/VoiceArtist/SoundEngineer/QualityReviewer
    # 基础层
    "crates/core",      # 核心抽象·业务领域模型·错误类型·事件总线·跨 crate trait
    # Step 1  素材导入
    "crates/intake",    # 本地导入·元数据提取·缩略图·格式检测
    # Step 2  智能拆条
    "crates/detect",    # FFmpeg 场景检测·情绪峰值·关键帧·集数扫描
    # Step 3  脚本生成
    "crates/script",    # 11 LLM Provider·第一人称风格引擎·流式输出
    # Step 4  TTS 配音
    "crates/voice",     # Edge-TTS/OpenAI-TTS/GPT-SoVITS·人声克隆·情绪适配
    # Step 5  字幕合成
    "crates/subtitle",  # VAD端点检测·SRT/VTT/ASS·动态字幕·双语
    # Step 6  画面对齐
    "crates/compose",   # 节奏匹配·BGM混音·时间轴合成·DAG并行
    # Step 7  多平台导出
    "crates/export",    # 8平台预设·剪映草稿(优先)·封面生成·竖屏裁剪
    # 基础设施
    "crates/storage",   # 项目持久化·SQLite·缩略图缓存·断点续传·API Key(Keychain)
    "crates/update",    # 自动更新引擎·版本检查·SemVer
]

[workspace.package]
version = "1.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Agions"]
repository = "https://github.com/Agions/dramaxis"
homepage = "https://dramaxis.dev"

[workspace.dependencies]
# Tauri 2 + 插件
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# 序列化 & 类型
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
thiserror = "2"
anyhow = "1"

# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
rayon = "1.10"

# HTTP 客户端
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# 系统调用
dirs = "5"

# 进程 & IO
serde_with = "3"
walkdir = "2"
notify = "6"

# 数据库
rusqlite = { version = "0.32", features = ["bundled", "chrono", "backup"] }

# 时间
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting"] }
semver = { version = "1", features = ["serde"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# 测试
tokio-test = "0.4"
mockall = "0.13"
proptest = "1.5"
rstest = "0.25"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_imports = "warn"
dead_code = "warn"

[package]
name = "dramaxis"
version = "1.2.0"
description = "dramaxis v1.2.0 · 剧枢 — 电影级多智能体影视叙事与智能解说平台 (Tauri 2 + Rust)"
authors = ["Agions"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "dramaxis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"

# ── dramaxis 工作流 crates ──
# 基础层
dramaxis-core    = { path = "crates/core" }
# Step 1 素材导入
dramaxis-intake  = { path = "crates/intake" }
# Step 2 智能拆条
dramaxis-detect  = { path = "crates/detect" }
# Step 3 脚本生成
dramaxis-script  = { path = "crates/script" }
# Step 4 TTS 配音
dramaxis-voice   = { path = "crates/voice" }
# Step 5 字幕合成
dramaxis-subtitle = { path = "crates/subtitle" }
# Step 6 画面对齐
dramaxis-compose = { path = "crates/compose" }
# Step 7 多平台导出
dramaxis-export  = { path = "crates/export" }
# 基础设施
dramaxis-storage = { path = "crates/storage" }
dramaxis-update  = { path = "crates/update" }
dramaxis-agent   = { path = "crates/agent" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
incremental = true