[package]
name = "dramaxis-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust Native Multi-Agent Autonomous Video Storytelling Engine"

[dependencies]
dramaxis-core = { path = "../core" }
dramaxis-detect = { path = "../detect" }
dramaxis-script = { path = "../script" }
dramaxis-voice = { path = "../voice" }
dramaxis-subtitle = { path = "../subtitle" }
dramaxis-compose = { path = "../compose" }
dramaxis-export = { path = "../export" }

async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
futures = { workspace = true }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
base64 = "0.22"
