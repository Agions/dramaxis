<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dramaxis (剧枢) Light Emblem">
  <title>Dramaxis (剧枢) - 电影级多智能体影视叙事与智能解说平台 (浅色模式)</title>
  <defs>
    <!-- 浅色模式背景：温润凝脂灰白与极浅琥珀渐变 -->
    <radialGradient id="lightBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </radialGradient>

    <!-- 浓郁醇厚电影黑金渐变 -->
    <linearGradient id="richGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <linearGradient id="richGoldSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- 核心棱镜高光渐变 -->
    <linearGradient id="lightPrism" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="lightPrismShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- 柔和阴影滤镜 -->
    <filter id="lightDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D97706" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 1. 浅色底板与微边框 -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#lightBg)"/>
  <rect x="3" y="3" width="506" height="506" rx="110" ry="110"
        fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- 2. 背景微弱同心圆刻度 -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 10"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="2 14" opacity="0.3"/>

  <!-- 3. 图腾主体 -->
  <g id="dramaxis-emblem-light" filter="url(#lightDropShadow)">
    <!-- 垂直时间流轴 -->
    <rect x="114" y="120" width="34" height="272" rx="17" fill="url(#richGold)"/>
    <g fill="#FFFFFF" opacity="0.6">
      <rect x="122" y="152" width="18" height="6" rx="3"/>
      <rect x="122" y="174" width="18" height="6" rx="3"/>
      <rect x="122" y="196" width="18" height="6" rx="3"/>
      <rect x="122" y="310" width="18" height="6" rx="3"/>
      <rect x="122" y="332" width="18" height="6" rx="3"/>
      <rect x="122" y="354" width="18" height="6" rx="3"/>
    </g>

    <!-- 字母 D 电影胶片主弧桥 -->
    <path d="M 134 120 
             C 270 120, 396 174, 396 256 
             C 396 338, 270 392, 134 392
             C 172 376, 212 360, 240 342
             C 328 286, 332 226, 240 170
             C 212 152, 172 136, 134 120 Z"
          fill="url(#richGoldSecondary)"/>

    <!-- 核心 Play 棱镜 -->
    <path d="M 194 186 L 326 256 L 194 256 Z" fill="url(#lightPrism)"/>
    <path d="M 194 256 L 326 256 L 194 326 Z" fill="url(#lightPrismShade)"/>
    <path d="M 178 200 L 194 186 L 194 326 L 178 312 Z" fill="url(#richGold)" opacity="0.9"/>
    <circle cx="326" cy="256" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- 4. 星芒耀光 -->
  <g transform="translate(382, 128)">
    <ellipse cx="0" cy="0" rx="30" ry="2" fill="#0284C7" opacity="0.6"/>
    <path d="M 0 -20 Q 0 -4 16 0 Q 0 4 0 20 Q 0 4 -16 0 Q 0 -4 0 -20 Z" fill="url(#richGold)"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>
</svg>
