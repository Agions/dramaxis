<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-label="Dramaxis (剧枢) Horizontal Brand Logo">
  <title>Dramaxis 剧枢 - 电影级多智能体影视叙事与智能解说创作平台</title>
  <defs>
    <!-- 渐变与滤镜定义 -->
    <linearGradient id="hzGoldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="hzTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="hzAuroraLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="hzGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. 左侧：高精度微缩版 Dramaxis 徽标 (140x140 区域，居中) -->
  <g transform="translate(20, 20) scale(0.2734375)">
    <!-- 曜石底板 -->
    <rect width="512" height="512" rx="112" ry="112" fill="#0E1018"/>
    <rect x="3" y="3" width="506" height="506" rx="110" ry="110"
          fill="none" stroke="url(#hzGoldMain)" stroke-width="3" opacity="0.45"/>

    <!-- 刻度底纹 -->
    <circle cx="256" cy="256" r="216" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-dasharray="6 12" opacity="0.2"/>

    <!-- 竖轴 -->
    <rect x="114" y="120" width="34" height="272" rx="17" fill="url(#hzGoldMain)"/>
    <g fill="#0E1018" opacity="0.6">
      <rect x="122" y="152" width="18" height="6" rx="3"/>
      <rect x="122" y="174" width="18" height="6" rx="3"/>
      <rect x="122" y="196" width="18" height="6" rx="3"/>
      <rect x="122" y="310" width="18" height="6" rx="3"/>
      <rect x="122" y="332" width="18" height="6" rx="3"/>
      <rect x="122" y="354" width="18" height="6" rx="3"/>
    </g>

    <!-- 弧桥 -->
    <path d="M 134 120 
             C 270 120, 396 174, 396 256 
             C 396 338, 270 392, 134 392
             C 172 376, 212 360, 240 342
             C 328 286, 332 226, 240 170
             C 212 152, 172 136, 134 120 Z"
          fill="url(#hzGoldMain)"/>

    <!-- 核心 Play 棱镜 -->
    <path d="M 194 186 L 326 256 L 194 256 Z" fill="#FFFFFF"/>
    <path d="M 194 256 L 326 256 L 194 326 Z" fill="#D97706"/>
    <path d="M 178 200 L 194 186 L 194 326 L 178 312 Z" fill="url(#hzGoldMain)"/>
    <circle cx="326" cy="256" r="6" fill="#FFFFFF"/>

    <!-- 星芒 -->
    <g transform="translate(382, 128)">
      <ellipse cx="0" cy="0" rx="36" ry="3" fill="#38BDF8"/>
      <path d="M 0 -22 Q 0 -5 18 0 Q 0 5 0 22 Q 0 5 -18 0 Q 0 -5 0 -22 Z" fill="#FFF9C4"/>
    </g>
  </g>

  <!-- 2. 右侧：Dramaxis 电影品牌排版组合 -->
  <g transform="translate(184, 40)">
    <!-- 品牌英文名称 -->
    <text x="0" y="56"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
          font-size="54"
          font-weight="900"
          letter-spacing="-0.8"
          fill="url(#hzTextGrad)"
          filter="url(#hzGlow)">Dramaxis</text>

    <!-- 中文「剧枢」微拟态科技徽章 -->
    <g transform="translate(276, 14)">
      <rect x="0" y="0" width="76" height="34" rx="10"
            fill="#F59E0B" fill-opacity="0.12"
            stroke="url(#hzGoldMain)" stroke-width="1.2"/>
      <text x="38" y="24"
            font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"
            font-size="19"
            font-weight="800"
            fill="#FDE047"
            text-anchor="middle">剧枢</text>
    </g>

    <!-- 版本 / 多智能体微徽标 -->
    <g transform="translate(362, 18)">
      <rect x="0" y="0" width="70" height="26" rx="6"
            fill="#06B6D4" fill-opacity="0.15"
            stroke="#06B6D4" stroke-width="0.8"/>
      <text x="35" y="18"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11"
            font-weight="700"
            fill="#38BDF8"
            text-anchor="middle">v1.2.0 AI</text>
    </g>

    <!-- 动态分割线 -->
    <line x1="0" y1="74" x2="480" y2="74" stroke="url(#hzAuroraLine)" stroke-width="1.2" opacity="0.6"/>

    <!-- 副标题文案 -->
    <text x="2" y="98"
          font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"
          font-size="15"
          font-weight="500"
          letter-spacing="0.6"
          fill="#94A3B8">电影级多智能体影视叙事与智能解说平台 · 100% 本地优先</text>
  </g>
</svg>
