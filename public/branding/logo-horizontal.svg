<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" role="img" aria-label="Dramaxis horizontal logo">
  <title>Dramaxis 剧枢 - 电影级多智能体影视叙事与智能解说创作平台</title>
  <defs>
    <linearGradient id="hzGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="hzTextGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 左侧图形徽标 (80x80 缩放居中) -->
  <g transform="translate(20, 20) scale(0.46875)">
    <rect width="256" height="256" rx="56" ry="56" fill="#12131A"/>
    <rect x="2" y="2" width="252" height="252" rx="54" ry="54" fill="none" stroke="url(#hzGold)" stroke-width="3" opacity="0.4"/>
    
    <g transform="translate(128 126)">
      <!-- 影视胶片与时间中枢剪影 -->
      <path d="M -64 -42 L -22 46 C -16 58 -4 64 8 56 L 0 42 C -8 46 -14 42 -18 32 L -48 -42 Z" fill="url(#hzGold)"/>
      <path d="M 64 -42 L 22 46 C 16 58 4 64 -8 56 L 0 42 C 8 46 14 42 18 32 L 48 -42 Z" fill="url(#hzGold)"/>
      <path d="M -38 -20 L 0 40 L 38 -20" fill="none" stroke="#FFFBEB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#FDE047">
        <rect x="-24" y="-12" width="4" height="20" rx="2"/>
        <rect x="-14" y="-24" width="4" height="34" rx="2"/>
        <rect x="-4"  y="-34" width="4" height="48" rx="2"/>
        <rect x="6"   y="-28" width="4" height="40" rx="2"/>
        <rect x="16"  y="-16" width="4" height="26" rx="2"/>
      </g>
    </g>
  </g>

  <!-- 右侧品牌文本: Dramaxis (英) + 剧枢 (中) + 副标 -->
  <g transform="translate(160, 42)">
    <!-- Dramaxis 科技质感字型 -->
    <text x="0" y="48" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="-0.5" fill="url(#hzTextGold)">Dramaxis</text>
    <!-- 中文 剧枢 标签 -->
    <rect x="250" y="14" width="68" height="32" rx="8" fill="#F5C842" fill-opacity="0.15" stroke="#F5C842" stroke-width="1"/>
    <text x="284" y="36" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#F5C842" text-anchor="middle">剧枢</text>

    <!-- Subtitle 副标题描述 -->
    <text x="2" y="80" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="500" fill="#9CA3AF" letter-spacing="0.5">电影级多智能体影视叙事与智能解说平台 · 100% 本地优先</text>
  </g>
</svg>