<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dramaxis (剧枢) Emblem">
  <title>Dramaxis (剧枢) - 电影级多智能体影视叙事与智能解说平台</title>
  <defs>
    <!-- 深空曜石电影级背景渐变 -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%" fx="45%" fy="30%">
      <stop offset="0%" stop-color="#1B1E2E"/>
      <stop offset="55%" stop-color="#0F111A"/>
      <stop offset="100%" stop-color="#08090E"/>
    </radialGradient>

    <!-- 电影级主琥珀黄金渐变 -->
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- 侧翼次级金属反光渐变 -->
    <linearGradient id="goldSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- 核心棱镜高光渐变 -->
    <linearGradient id="prismLight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFFBEB"/>
      <stop offset="70%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- 棱镜阴影折射面 -->
    <linearGradient id="prismShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- 多模态 AI 青蓝与霓紫极光微光 -->
    <linearGradient id="aiAurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- 柔和电影外发光滤镜 -->
    <filter id="cinematicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="flareGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 圆角裁切 -->
    <clipPath id="squircle">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- 1. 圆角深空底板 -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGlow)"/>

  <!-- 2. 金属高光微内边框 -->
  <rect x="3" y="3" width="506" height="506" rx="110" ry="110"
        fill="none" stroke="url(#goldBeam)" stroke-width="2.5" opacity="0.38"/>

  <!-- 3. 背景层：胶片中枢齿孔与多轨道时间轴刻度环 -->
  <g clip-path="url(#squircle)" opacity="0.12">
    <!-- 电影镜头刻度同心圆 -->
    <circle cx="256" cy="256" r="216" fill="none" stroke="#FDE047" stroke-width="2" stroke-dasharray="6 10"/>
    <circle cx="256" cy="256" r="172" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 14"/>
    <circle cx="256" cy="256" r="130" fill="none" stroke="#F5C842" stroke-width="1" opacity="0.6"/>

    <!-- 8 方位对齐瞄准星准线 -->
    <line x1="256" y1="24" x2="256" y2="72" stroke="#FDE047" stroke-width="2"/>
    <line x1="256" y1="440" x2="256" y2="488" stroke="#FDE047" stroke-width="2"/>
    <line x1="24" y1="256" x2="72" y2="256" stroke="#FDE047" stroke-width="2"/>
    <line x1="440" y1="256" x2="488" y2="256" stroke="#FDE047" stroke-width="2"/>
  </g>

  <!-- 4. Dramaxis (剧枢) 核心视觉图腾:
         [时间主轴垂直柱] + [解构的大写 D 电影胶卷曲面] + [三维高能 Play 核心棱镜] -->
  <g id="dramaxis-emblem">
    <!-- A. 左侧：垂直时间流中枢轴 (Timeline Axis) -->
    <g filter="url(#cinematicGlow)">
      <!-- 竖轴主基座 (124px 到 388px) -->
      <rect x="114" y="120" width="34" height="272" rx="17" fill="url(#goldBeam)"/>

      <!-- 竖轴音频/时间码刻度带槽 -->
      <g fill="#0D0E15" opacity="0.55">
        <rect x="122" y="152" width="18" height="6" rx="3"/>
        <rect x="122" y="174" width="18" height="6" rx="3"/>
        <rect x="122" y="196" width="18" height="6" rx="3"/>
        <rect x="122" y="310" width="18" height="6" rx="3"/>
        <rect x="122" y="332" width="18" height="6" rx="3"/>
        <rect x="122" y="354" width="18" height="6" rx="3"/>
      </g>
    </g>

    <!-- B. 右侧：电影光学动态拱桥弧线 (The Drama Arc - 构成字母 D 的外环与胶片曲率) -->
    <path d="M 134 120 
             C 270 120, 396 174, 396 256 
             C 396 338, 270 392, 134 392
             C 172 376, 212 360, 240 342
             C 328 286, 332 226, 240 170
             C 212 152, 172 136, 134 120 Z"
          fill="url(#goldSecondary)"
          filter="url(#cinematicGlow)"/>

    <!-- 弧桥内沿极光微光线条 (象征 5 轨磁吸对齐轨道) -->
    <path d="M 152 144
             C 256 144, 364 190, 364 256
             C 364 322, 256 368, 152 368"
          fill="none"
          stroke="url(#aiAurora)"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.85"/>

    <!-- C. 中心：三维高光 Play 核心棱镜 (Kinetic 3D Play Prism) -->
    <!-- 棱镜顶面：受光最强白金琥珀 -->
    <path d="M 194 186
             L 326 256
             L 194 256 Z"
          fill="url(#prismLight)"
          filter="url(#cinematicGlow)"/>

    <!-- 棱镜底面：立体下切阴影黄金 -->
    <path d="M 194 256
             L 326 256
             L 194 326 Z"
          fill="url(#prismShade)"/>

    <!-- 棱镜左侧连接轴光柱 -->
    <path d="M 178 200
             L 194 186
             L 194 326
             L 178 312 Z"
          fill="url(#goldBeam)"
          opacity="0.9"/>

    <!-- 核心光斑点睛 (Prism Vertex Flare) -->
    <circle cx="326" cy="256" r="4.5" fill="#FFFFFF" filter="url(#flareGlow)"/>
  </g>

  <!-- 5. 右上方 AI 宽银幕变形耀斑与智慧星芒 (Anamorphic Starburst & AI Spark) -->
  <g id="ai-starburst" transform="translate(382, 128)" filter="url(#flareGlow)">
    <!-- 宽银幕横向水平耀光条 (电影质感标志) -->
    <ellipse cx="0" cy="0" rx="36" ry="2" fill="#38BDF8" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="18" ry="1.2" fill="#FFFFFF"/>

    <!-- 四角核心星芒 -->
    <path d="M 0 -22 Q 0 -5 18 0 Q 0 5 0 22 Q 0 5 -18 0 Q 0 -5 0 -22 Z"
          fill="url(#goldBeam)"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <!-- 次级微型火花点缀 -->
  <g transform="translate(416, 172)" opacity="0.75">
    <path d="M 0 -10 Q 0 -2 8 0 Q 0 2 0 10 Q 0 2 -8 0 Q 0 -2 0 -10 Z"
          fill="#FFF9C4"/>
  </g>
</svg>
